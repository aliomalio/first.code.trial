{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>Sign in</h2>
  <p class="muted">Use your team credentials to access your role dashboard.</p>
  <form method="post" class="grid-form">
    <label>Email
      <input type="email" name="email" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button class="btn" type="submit">Login</button>
  </form>
  <small class="muted">Demo password for seeded users: password123</small>
</section>
{% endblock %}
